version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 5
    semver-major-days: 7
    semver-minor-days: 5
    semver-patch-days: 3
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 5
    semver-major-days: 7
    semver-minor-days: 5
    semver-patch-days: 3
